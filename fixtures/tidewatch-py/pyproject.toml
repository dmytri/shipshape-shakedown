[project]
name = "tidewatch"
version = "0.1.0"
description = "Tide prediction"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-bdd>=8.1",
  "pytest-cov>=6.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "vulture>=2.11",
  "poethepoet>=0.29",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
bdd_features_base_dir = "features"
markers = ["logic: default verification tier"]
